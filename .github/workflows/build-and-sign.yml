name: Android CI Build & Asset Signer

on:
  push:
    branches: [ "main", "master", "devel" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Assemble and Sign Android Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK Runtime
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Local Environment Variables
        run: |
          # The Secrets Gradle Plugin requires a .env file to exist to avoid build-time errors.
          # We check if .env is missing and touch/provide default credentials safely.
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Extract Integrated Debug Keystore
        run: |
          # Use the repository's encoded base64 key to restore the official debug keystore.
          # This enables the applet to construct fully-signed debug binary packages out of the box.
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding integrated debug keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found, relying on default Local AGP generation."
          fi

      - name: Extract Custom Release Upload Keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Decode user-supplied release credentials if present in repository actions secrets.
          echo "Decoding custom repository Keystore..."
          echo "$KEYSTORE_BASE64" | base64 -d > release-upload-key.jks

      - name: Build Debug Application APK
        run: gradle :app:assembleDebug

      - name: Build Release Application APK
        # If the user has supplied custom signing secrets, pass them directly to Gradle as environment parameters
        # matching our app/build.gradle.kts configuration.
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" != "" ]; then
            echo "Assembling fully-signed production release package..."
            gradle :app:assembleRelease
          else
            echo "Release key is missing. Assembling unsigned/default release package for local validation..."
            gradle :app:assembleRelease
          fi

      - name: Locate Compiled Packages
        run: |
          echo "=== Debug Outputs ==="
          ls -R app/build/outputs/apk/debug/ || true
          echo "=== Release Outputs ==="
          ls -R app/build/outputs/apk/release/ || true

      - name: Archive Debug App Build (Signed Demo APK)
        uses: actions/upload-artifact@v4
        with:
          name: DrawAnimate-Debug-Signed-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Archive Production App Build (Release APK)
        uses: actions/upload-artifact@v4
        with:
          name: DrawAnimate-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
